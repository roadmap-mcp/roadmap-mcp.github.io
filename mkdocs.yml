site_name: Roadmap MCP Documentation
site_description: Documentation for Roadmap and its AI-backed Knowledge Base
site_url: https://docs.roadmap-mcp.com/
copyright: Roadmap documentation

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/map-marker-path

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Lite: get-started/lite.md
      - "Pro: download and install": get-started/pro.md
      - Configuring Git: get-started/git.md
      - Users and roles: get-started/users.md
      - Your account and API tokens: get-started/account.md
  - Knowledge Base:
      - knowledge-base/index.md
      - Concepts: knowledge-base/concepts.md
      - Setting up personas and node types: knowledge-base/setup.md
      - Packs: knowledge-base/packs.md
      - The document format: knowledge-base/documents.md
      - The explorer: knowledge-base/explorer.md
      - Flows: knowledge-base/flows.md
      - Orchestration: knowledge-base/orchestration.md
      - Branches: knowledge-base/branches.md
      - Chat: knowledge-base/chat.md
      - "Walkthrough: a feature end to end": knowledge-base/walkthrough.md
  - Reference:
      - reference/index.md
      - MCP tools: reference/mcp-tools.md
      - HTTP API: reference/http-api.md
      - Configuration: reference/configuration.md
      - Store schema: reference/store.md
  - Platform:
      - platform/index.md
  - roadmap-mcp.com: https://roadmap-mcp.com/

extra:
  social:
    - icon: material/web
      link: https://roadmap-mcp.com/
      name: Roadmap MCP website
