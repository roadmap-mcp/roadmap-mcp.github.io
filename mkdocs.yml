site_name: Roadmap MCP Documentation
site_description: Documentation for Roadmap and its AI-backed Knowledge Base
site_url: https://docs.roadmap-mcp.com/
copyright: Roadmap documentation

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/home

plugins:
  - search
  - glightbox:
      skip_classes:
        - no-zoom

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - About: index.md
  - Setup:
      - get-started/index.md
      - Lite: get-started/lite.md
      - Pro: get-started/pro.md
      - Workspaces: get-started/workspaces.md
      - Users and roles: get-started/users.md
      - Your account and API tokens: get-started/account.md
      - Configuring Git: get-started/git.md
      - Installing packs: knowledge-base/packs.md
      - Plugins: get-started/plugins.md
  - Lite edition:
      - lite/index.md
  - Pro edition:
      - knowledge-base/index.md
      - Concepts: knowledge-base/concepts.md
      - Personas: knowledge-base/personas.md
      - Topics: knowledge-base/topics.md
      - The explorer: knowledge-base/explorer.md
      - Flows: knowledge-base/flows.md
      - Orchestration: knowledge-base/orchestration.md
      - Branches: knowledge-base/branches.md
      - Chat: knowledge-base/chat.md
      - "Scenario: implement a simple use case": knowledge-base/walkthrough.md

extra:
  social:
    - icon: material/web
      link: https://roadmap-mcp.com/
      name: Roadmap MCP website
